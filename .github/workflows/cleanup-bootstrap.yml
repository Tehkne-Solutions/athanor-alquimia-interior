name: Cleanup bootstrap transport

on:
  push:
    branches:
      - agent/fase-4.1-vertical-slice

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/fase-4.1-vertical-slice
          fetch-depth: 0

      - name: Remove temporary transport files
        run: rm -rf bootstrap build-error.log

      - name: Commit cleanup
        run: |
          git config user.name "Tehkné Solutions"
          git config user.email "tehkne-solutions@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove bootstrap transport files"
          git push origin HEAD:agent/fase-4.1-vertical-slice
