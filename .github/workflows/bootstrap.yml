name: Bootstrap Athanor vertical slice

on:
  push:
    branches:
      - agent/fase-4.1-vertical-slice
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  restore-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/fase-4.1-vertical-slice
          fetch-depth: 0

      - name: Restore and verify project archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import tarfile

          chunks = sorted(Path('bootstrap').glob('chunk-*.b64'))
          if len(chunks) != 10:
              raise SystemExit(f'Expected 10 chunks, found {len(chunks)}')

          encoded = ''.join(chunk.read_text(encoding='utf-8').strip() for chunk in chunks)
          encoded_hash = hashlib.sha256(encoded.encode('ascii')).hexdigest()
          expected_encoded_hash = 'a1fb452858981da2fb241c0d472ab47717c3504742a33b6c41b62ef12e31a3f5'
          if len(encoded) != 45132 or encoded_hash != expected_encoded_hash:
              raise SystemExit('Bootstrap chunks do not match the source package')

          archive_bytes = base64.b64decode(encoded, validate=True)
          archive_hash = hashlib.sha256(archive_bytes).hexdigest()
          expected_archive_hash = 'd56ad7f731af5625957d78d119ab7d9cfc2e3315613f94c02998ba70a1e1a610'
          if len(archive_bytes) != 33847 or archive_hash != expected_archive_hash:
              raise SystemExit('Decoded archive does not match the source package')

          archive_path = Path('/tmp/athanor-project.tar.gz')
          archive_path.write_bytes(archive_bytes)
          with tarfile.open(archive_path, 'r:gz') as archive:
              archive.extractall('.')
          PY
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and create lockfile
        run: npm install --no-audit --no-fund

      - name: Validate content
        run: npm run validate:content

      - name: Run tests
        run: npm test

      - name: Capture production build
        id: production_build
        shell: bash
        run: |
          set +e
          npm run build 2>&1 | tee build-error.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit restored implementation and diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tehkné Solutions"
          git config user.email "tehkne-solutions@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Athanor vertical slice"
          git push origin HEAD:agent/fase-4.1-vertical-slice

      - name: Enforce production build result
        if: steps.production_build.outputs.exit_code != '0'
        run: exit 1
