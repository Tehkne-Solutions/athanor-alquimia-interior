name: Bootstrap Athanor vertical slice

on:
  push:
    branches:
      - agent/fase-4.1-vertical-slice

permissions:
  contents: write

jobs:
  restore-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore project archive
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/chunk-*.b64 > /tmp/athanor-project.tar.gz.b64
          base64 --decode /tmp/athanor-project.tar.gz.b64 > /tmp/athanor-project.tar.gz
          tar -xzf /tmp/athanor-project.tar.gz -C .
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate content
        run: npm run validate:content

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit restored implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Tehkné Solutions"
          git config user.email "tehkne-solutions@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement Athanor vertical slice"
          git push origin HEAD:agent/fase-4.1-vertical-slice
