name: Athanor CI

on:
  push:
    branches:
      - main
      - agent/fase-4.1-vertical-slice
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate content
        id: content_validation
        shell: bash
        run: |
          set +e
          npm run validate:content > content-validation.log 2>&1
          status=$?
          tail -n 80 content-validation.log
          exit $status

      - name: Upload content diagnostics
        if: failure() && steps.content_validation.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: athanor-content-diagnostics
          path: content-validation.log
          if-no-files-found: error
          retention-days: 1

      - name: Run tests
        id: tests
        shell: bash
        run: |
          set +e
          npm test > test.log 2>&1
          status=$?
          tail -n 120 test.log
          exit $status

      - name: Upload test diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: athanor-test-diagnostics
          path: test.log
          if-no-files-found: error
          retention-days: 1

      - name: Build production bundle
        id: build
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          tail -n 80 build.log
          exit $status

      - name: Upload build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: athanor-build-diagnostics
          path: build.log
          if-no-files-found: error
          retention-days: 1
